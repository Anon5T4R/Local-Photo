[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["libs"]
default-members = ["crates/*", "apps/localphoto", "apps/localphoto-cli", "xtask"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Anon5T4R/Local-Photo"

[workspace.dependencies]
# Vendored craft libs (libs/craft-libs, rev 1e6f1278 base; crates/update comes from
# local-libs, the suite's single source for it).
craft-ui = { path = "libs/craft-libs/crates/ui/", features = ["serde"] }
craft-docpath = { version = "0.1.0", path = "libs/craft-libs/crates/docpath/" }
craft-update = { version = "=0.1.0", path = "libs/craft-libs/crates/update/", features = ["egui", "icons"] }
# Shared MCP plumbing of the suite (stdio server skeleton, script/batch steps and the automation
# root flags); source of truth in local-libs, vendored here and replicated by its sync.ps1.
craft-mcp = { path = "libs/craft-libs/crates/mcp/" }
craft-window = { path = "libs/craft-libs/crates/window/", features = ["egui"] }
# internal
localphoto-denoise-core = { path = "crates/denoise-core" }
localphoto-denoise = { path = "crates/denoise", default-features = false }
localphoto-geom = { path = "crates/geom" }
localphoto-faces = { path = "crates/faces" }
localphoto-sysmem = { path = "crates/sysmem" }
localphoto-color = { path = "crates/color" }
localphoto-raster = { path = "crates/raster" }
localphoto-tiff = { path = "crates/tiff" }
localphoto-raw = { path = "crates/raw" }
localphoto-codecs = { path = "crates/codecs" }
localphoto-meta = { path = "crates/meta" }
localphoto-develop = { path = "crates/develop" }
localphoto-lensdb = { path = "crates/lensdb" }
localphoto-inpaint = { path = "crates/inpaint" }
localphoto-scenes = { path = "crates/scenes" }
localphoto-pipeline = { path = "crates/pipeline" }
localphoto-gpu = { path = "crates/gpu" }
localphoto-catalog = { path = "crates/catalog" }
localphoto-preview = { path = "crates/preview" }
localphoto-merge = { path = "crates/merge" }
localphoto-engine = { path = "crates/engine" }
localphoto-ui-egui = { path = "crates/ui-egui" }
localphoto-mcp = { path = "crates/mcp" }
localphoto-fetch = { path = "crates/fetch" }
localphoto-heif = { path = "crates/heif" }
localphoto-segment = { path = "crates/segment" }
localphoto-geocode = { path = "crates/geocode" }
localphoto-slideshow = { path = "crates/slideshow" }
localphoto-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
siphasher = "1"
libc = "0.2" # dev-only: process CPU time in benches
dhat = "0.3" # opt-in heap profiling (localphoto-cli --features dhat-heap) and heap tests; never in product builds

# formats
quick-xml = "0.41"
miniz_oxide = "0.9"

# codecs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }  # Apache-2.0, pure Rust glyph rasterizer (export watermarks)
png = "0.18"
tiff = "0.11"
image-webp = "0.2"
moxcms = { version = "0.9", default-features = false, features = ["lut"] }
jxl-oxide = { version = "0.12", default-features = false }
jixel = "=0.3.4" # BSD-3-Clause OR Apache-2.0, pure-Rust JPEG XL encoder (export; port of libjxl-tiny)
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] } # MIT/Apache-2.0/Zlib lossless JXL encoder (test fixtures only)
ravif = { version = "0.13", default-features = false, features = ["threading"] } # no "asm": it needs nasm (non-Rust)
# HDR AVIF (PQ): ravif fixes the sRGB transfer curve, so HDR files drive its rav1e + avif-serialize directly
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
avif-serialize = "0.8.6"

# gpu (crates/gpu; native backends only, no GL: everything stays pure Rust)
# SAM 3 inference (localphoto-segment). 0.9.2: later releases pull `tokenizers` with the
# Oniguruma C library into candle-core, and the product is pure Rust.
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "1"

# ui
# 0.37: `default_fonts` is no longer an egui default and the monochrome emoji faces moved behind
# `monochrome_emoji_fonts`. Every resolution root (native, CLI/headless, kittest, wasm) needs both:
# kittest's own dev-dependencies do not propagate to its consumers.
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
muda = { version = "0.21", default-features = false } # native menu bar (macOS: objc2/AppKit, pure Rust; no GTK)
# macOS: the profile of the screen showing the window (safe AppKit bindings; muda and wgpu use the same)
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSColorSpace", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData"] }
# Linux: the desktop's dark/light setting from the XDG settings portal (Settings ▸ Interface ▸
# Appearance Mode ▸ Auto). Pure Rust; the version accesskit already brings in, pinned to it.
zbus = "=5.19.0"
web-time = "1"

# web (apps/localphoto-web)
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false

# `cargo xtask web`: the browser build. Size matters more than build time: fat LTO, one codegen
# unit, no symbols, abort on panic (wasm32 can't unwind anyway), size-optimized code — except the
# crates that do per-pixel work, which stay at opt-level 3 (opt-level "s"/"z" there costs ~50 %/
# ~130 % render time; measured in docs/web.md → Bundle size).
[profile.web]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[profile.web.package]
localphoto-pipeline = { opt-level = 3 }
localphoto-raster = { opt-level = 3 }
localphoto-color = { opt-level = 3 }
localphoto-develop = { opt-level = 3 }
localphoto-geom = { opt-level = 3 }
localphoto-raw = { opt-level = 3 }
localphoto-codecs = { opt-level = 3 }
localphoto-scenes = { opt-level = 3 }
localphoto-preview = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
jpeg-encoder = { opt-level = 3 }
png = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }

# The egui family and winit are vendored forks under libs/ (path sources: egui
# 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc).
# rustls-rustcrypto is the suite's fork (libs/rustls-rustcrypto) that the vendored craft-update
# pins: the upstream alpha still pulls rustls-webpki 0.102 for `alg_id` alone.
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
rustls-rustcrypto = { path = "libs/rustls-rustcrypto" }
