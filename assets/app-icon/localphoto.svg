<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Glyph mask: white where an iris blade is, black where the tile shows through (the
         hexagonal opening and the six blade cuts), so it composites over the gradient. -->
    <mask id="iris">
      <circle cx="256" cy="252" r="132" fill="#ffffff"/>
      <polygon points="306.23,265.46 269.46,302.23 219.23,288.77 205.77,238.54 242.54,201.77 292.77,215.23" fill="#000000"/>
      <g stroke="#000000" stroke-width="10" stroke-linecap="butt">
      <line x1="269.46" y1="302.23" x2="195.86" y2="375.82"/>
      <line x1="219.23" y1="288.77" x2="118.70" y2="261.83"/>
      <line x1="205.77" y1="238.54" x2="178.83" y2="138.01"/>
      <line x1="242.54" y1="201.77" x2="316.14" y2="128.18"/>
      <line x1="292.77" y1="215.23" x2="393.30" y2="242.17"/>
      <line x1="306.23" y1="265.46" x2="333.17" y2="365.99"/>
      </g>
    </mask>
  </defs>

  <!-- Local Photo tile -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="256" rx="100" fill="url(#sheen)"/>

  <!-- The iris: a ring with a hexagonal opening - the mark that tells Local Photo apart. -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#ffffff" mask="url(#iris)"/>

  <!-- brand signature -->
  <text x="256" y="460" font-family="Segoe Script, cursive" font-size="40"
        fill="#ffffff" opacity="0.55" text-anchor="middle">Taylor</text>
</svg>
