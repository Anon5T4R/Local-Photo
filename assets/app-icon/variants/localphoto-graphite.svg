<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Glyph mask: white where an iris blade is, black where the tile shows through (the
         hexagonal opening and the six blade cuts), so it composites over the gradient. -->
    <mask id="iris">
      <circle cx="256" cy="252" r="155" fill="#ffffff"/>
      <polygon points="314.92,267.79 271.79,310.92 212.87,295.13 197.08,236.21 240.21,193.08 299.13,208.87" fill="#000000"/>
      <g stroke="#000000" stroke-width="11.5" stroke-linecap="butt">
      <line x1="271.79" y1="310.92" x2="185.37" y2="397.34"/>
      <line x1="212.87" y1="295.13" x2="94.81" y2="263.50"/>
      <line x1="197.08" y1="236.21" x2="165.45" y2="118.16"/>
      <line x1="240.21" y1="193.08" x2="326.63" y2="106.66"/>
      <line x1="299.13" y1="208.87" x2="417.19" y2="240.50"/>
      <line x1="314.92" y1="267.79" x2="346.55" y2="385.84"/>
      </g>
    </mask>
  </defs>

  <!-- Local Photo tile -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="256" rx="100" fill="url(#sheen)"/>

  <!-- The iris: a ring with a hexagonal opening - the mark that tells Local Photo apart. -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#ffffff" mask="url(#iris)"/>

  <!-- brand signature -->
  <text x="256" y="460" font-family="Segoe Script, cursive" font-size="40"
        fill="#ffffff" opacity="0.85" text-anchor="middle">Taylor</text>
</svg>
